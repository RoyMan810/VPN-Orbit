[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-orbit"
version = "1.0.0"
description = "Self-hosted infrastructure Controller"
requires-python = ">=3.13"
dependencies = ["fastapi==0.162.4", "uvicorn==0.54.0", "argon2-cffi==25.1.0", "PyNaCl==1.6.2", "asyncssh==2.24.1"]

[project.scripts]
vpn-orbit = "vpn_orbit.cli:main"
vpn-orbit-runtime = "vpn_orbit.runtime.cli:main"
vpn-orbit-app = "vpn_orbit.app_lifecycle:main"
vpn-orbit-app-helper = "vpn_orbit.app_helper:main"
vpn-orbit-app-postgres = "vpn_orbit.app_postgres:main"

[tool.setuptools.packages.find]
include = ["vpn_orbit*"]

[tool.setuptools.package-data]
vpn_orbit = ["release-manifest.json"]

[tool.ruff]
required-version = "==0.17.5"
target-version = "py313"

[tool.ruff.lint]
# Correctness checks without rewriting the accepted Foundation source.
select = ["E9", "F63", "F7", "F82"]
