name: VPN-Orbit product lifecycle

on:
  pull_request:
    paths: &application_paths
      - vpn_orbit/app_*.py
      - vpn_orbit/application_requests.py
      - vpn_orbit/worker.py
      - vpn_orbit/runtime/**
      - remote/apps-gateway
      - vpn_orbit/application-images.json
      - tests/runtime/test_app*.py
      - tests/lab/application_*.py
      - .github/workflows/applications.yml
  push:
    branches: [main]
    paths: *application_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Remnawave Panel / actual lifecycle and fault acceptance
            module: application_lifecycle
          - name: Remnawave Node / host network and mutual TLS
            module: application_node
          - name: Remnawave Panel and Node / existing link through adoption
            module: application_panel_node
          - name: Adopted Remnawave Panel / encrypted PostgreSQL backup and isolated restore
            module: application_adopted_postgres
          - name: Application SSH / durable jobs and reconciliation
            module: application_ssh
          - name: Bedolaga Bot and Cabinet / adoption and isolated database restore
            module: application_bedolaga
          - name: Bedolaga Bot / webhook receiver and header authentication
            module: application_webhook
          - name: Remnawave and Bedolaga / actual PostgreSQL backup and restore
            module: application_postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.3
          set-host: true
      - name: Exercise actual product startup and ownership protection
        env:
          MODULE: ${{ matrix.module }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python -m pip install -r requirements-app.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server iproute2 sudo
          # The lifecycle executor deliberately uses the normal local socket.
          # Keep the action's private daemon and expose exactly that socket.
          sudo systemctl stop docker.service docker.socket || true
          sudo ln -sfn "${DOCKER_HOST#unix://}" /run/docker.sock
          if [[ "$MODULE" = application_postgres || "$MODULE" = application_adopted_postgres || "$MODULE" = application_bedolaga ]]; then
            python tools/fetch_age.py --output "$RUNNER_TEMP/pg-age.tar.gz"
            tar --no-same-owner -xzf "$RUNNER_TEMP/pg-age.tar.gz" -C "$RUNNER_TEMP" -- age/age age/age-keygen
            sudo chmod 0755 /opt
            sudo install -d -m 0755 /opt/vpn-orbit/tools
            sudo install -o root -g root -m 0755 "$RUNNER_TEMP/age/age" /opt/vpn-orbit/tools/age
          fi
          sudo -n env PYTHONPATH="$PWD" GITHUB_ACTIONS=true \
            "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "VPN_ORBIT_PG_AGE_KEYGEN=$RUNNER_TEMP/age/age-keygen" \
            "$(command -v python)" -m tests.lab.${{ matrix.module }}
