name: VPN-Orbit two-host recovery

on:
  pull_request:
    paths: [".github/workflows/recovery.yml", "tests/lab/recovery_hosts.py", "tests/lab/installation.py", "deploy/**", "vpn_orbit/**"]
  push:
    branches: [main]
    paths: [".github/workflows/recovery.yml", "tests/lab/recovery_hosts.py", "tests/lab/installation.py", "deploy/**", "vpn_orbit/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate test-only backup identity for this isolated run
        run: |
          python3 tools/fetch_age.py --output "$RUNNER_TEMP/age.tar.gz"
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" -- age/age-keygen
          "$RUNNER_TEMP/age/age-keygen" -o "$RUNNER_TEMP/isolated-lab.identity"
          "$RUNNER_TEMP/age/age-keygen" -y "$RUNNER_TEMP/isolated-lab.identity" > "$RUNNER_TEMP/recipient"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-only-lab-identity
          path: ${{ runner.temp }}/isolated-lab.identity
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-only-lab-recipient
          path: ${{ runner.temp }}/recipient
          retention-days: 1

  source:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-only-lab-recipient
          path: ${{ runner.temp }}/handoff
      - run: python3 tests/lab/recovery_hosts.py fixture --transfer "$RUNNER_TEMP"
      - &install
        name: Install the Controller on a fresh disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo chmod 0755 /opt
          sudo systemctl stop docker.service docker.socket containerd.service || true
          mapfile -t installed < <(dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' \
            docker-ce docker-ce-cli docker-ce-rootless-extras docker-buildx-plugin docker-compose-plugin moby-engine moby-cli moby-containerd moby-buildx moby-compose \
            containerd.io docker.io docker-buildx docker-compose docker-compose-v2 containerd runc 2>/dev/null \
            | awk '$2 == "installed" { print $1 }')
          if (( ${#installed[@]} )); then
            sudo apt-get purge -y "${installed[@]}"
          fi
          sudo rm -f /etc/apt/sources.list.d/docker.list /etc/apt/sources.list.d/docker.sources
          if test -f "$RUNNER_TEMP/targets.json"; then
            sudo ./install --targets "$RUNNER_TEMP/targets.json"
          else
            sudo ./install
          fi
      - name: Back up generated fixtures and stop the source
        run: |
          mkdir "$RUNNER_TEMP/export"
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /opt/vpn-orbit/venv/bin/python tests/lab/recovery_hosts.py source \
            --transfer "$RUNNER_TEMP/export" --key "$RUNNER_TEMP/handoff/recipient"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-fixture-encrypted
          path: ${{ runner.temp }}/export
          retention-days: 1

  destination:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-fixture-encrypted
          path: ${{ runner.temp }}/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-only-lab-identity
          path: ${{ runner.temp }}/handoff
      - *install
      - name: Restore and activate after independently hosted source job ended
        run: |
          sudo install -d -m 0700 /run/vpn-orbit/lab-transfer
          sudo install -m 0600 "$RUNNER_TEMP/transfer/"* /run/vpn-orbit/lab-transfer/
          sudo install -m 0600 "$RUNNER_TEMP/handoff/isolated-lab.identity" /run/vpn-orbit/lab-transfer/identity
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /opt/vpn-orbit/venv/bin/python tests/lab/recovery_hosts.py destination \
            --transfer /run/vpn-orbit/lab-transfer --key /run/vpn-orbit/lab-transfer/identity
