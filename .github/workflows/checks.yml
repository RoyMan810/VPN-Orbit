name: VPN-Orbit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VPN_ORBIT_LAB_DOCKER_VERSION: "29.9.3"
  VPN_ORBIT_LAB_PYTHON_IMAGE: docker.io/library/python@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928

jobs:
  quality:
    name: Repository quality / Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - run: python -m pip install -r requirements-quality.txt
      - run: ruff check .
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests/tools -t . -v

  time-health:
    name: Stage 1 host TimeHealth / ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [chrony, timesyncd]
    steps:
      - *checkout
      - *setup_python
      - name: Install fixed application dependencies and the selected host time daemon
        env:
          TIME_SOURCE: ${{ matrix.source }}
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          if test "$TIME_SOURCE" = chrony; then
            sudo apt-get install -y --no-install-recommends chrony
          else
            sudo apt-get install -y --no-install-recommends systemd-timesyncd
          fi
      - name: Verify actual daemon telemetry, protected IPC and kernel clock-step recovery
        env:
          TIME_SOURCE: ${{ matrix.source }}
        run: |
          sudo -n /usr/bin/env "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "$(command -v python)" tests/lab/time_health.py --isolated-vm --source "$TIME_SOURCE"

  installation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: checkout
            name: Stage 1 signed fresh installation / systemd and Compose
            artifact: stage1-bundle-evidence
          - channel: release-fixture
            name: Stage 1 signed release fixture / systemd and Compose
            artifact: stage1-release-fixture-evidence
    steps:
      - *checkout
      - *setup_python
      - &setup_docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v${{ env.VPN_ORBIT_LAB_DOCKER_VERSION }}
          set-host: true
      - name: Install fixed builder dependencies and generate an ephemeral lab signer
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server iproute2
          python - <<'PY'
          import os, pathlib
          from nacl.signing import SigningKey
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          signer = SigningKey.generate()
          (root / "vpn-orbit-lab-signer.seed").write_bytes(bytes(signer))
          (root / "vpn-orbit-lab-signer.seed").chmod(0o600)
          (root / "vpn-orbit-lab-signer.pub").write_bytes(bytes(signer.verify_key))
          PY
      - name: Build the signed wheel bundle without placing its private signer inside
        run: |
          age_dir="$RUNNER_TEMP/vpn-orbit-install-age"
          mkdir -p "$age_dir"
          python "$GITHUB_WORKSPACE/tools/fetch_age.py" --output "$age_dir/age.tar.gz"
          tar --no-same-owner -xzf "$age_dir/age.tar.gz" -C "$age_dir" -- age/age age/age-keygen
          python_image="$VPN_ORBIT_LAB_PYTHON_IMAGE"
          docker pull "$python_image"
          docker run --rm --network none "$python_image" python -c 'import sys,sqlite3; print(sys.version); print(sqlite3.sqlite_version); assert sys.version_info[:2]==(3,15) and sqlite3.sqlite_version_info>=(3,45)'
          if [ "${{ matrix.channel }}" = release-fixture ]; then
            git worktree add --detach "$RUNNER_TEMP/vpn-orbit-release-fixture"
            cd "$RUNNER_TEMP/vpn-orbit-release-fixture"
            python - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          project = Path("pyproject.toml")
          version = tomllib.loads(project.read_text())["project"]["version"]
          release = version.split(".dev", 1)[0]
          project.write_text(project.read_text().replace(f'version = "{version}"', f'version = "{release}"', 1))
          init = Path("vpn_orbit/__init__.py")
          init.write_text(init.read_text().replace(f'__version__ = "{version}"', f'__version__ = "{release}"'))
          path = Path("vpn_orbit/release-manifest.json")
          manifest = json.loads(path.read_text())
          path.write_text(json.dumps({**manifest, "version": release, "channel": "release"}, indent=2) + "\n")
          PY
            if ! git diff --quiet; then
              git -c user.name='VPN-Orbit CI' -c user.email='ci@example.invalid' commit -am 'Prepare release installation fixture'
            fi
          fi
          python deploy/build_bundle.py --output "$RUNNER_TEMP/vpn-orbit-install-bundle" \
            --signing-key "$RUNNER_TEMP/vpn-orbit-lab-signer.seed" \
            --python-image "$python_image" --age-tool "$age_dir/age/age"
      - name: Install and verify the actual host services and container namespaces
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" tests/lab/installation.py --isolated-vm \
            --bundle "$RUNNER_TEMP/vpn-orbit-install-bundle" --trust-key "$RUNNER_TEMP/vpn-orbit-lab-signer.pub" \
            --age-keygen "$RUNNER_TEMP/vpn-orbit-install-age/age/age-keygen" \
            --docker-host "$DOCKER_HOST"

      - name: Preserve public metadata for Stage1 revalidation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/vpn-orbit-install-bundle/manifest.json
            ${{ runner.temp }}/vpn-orbit-install-bundle/manifest.sig
            ${{ runner.temp }}/vpn-orbit-install-bundle/sbom.cdx.json
            ${{ runner.temp }}/vpn-orbit-lab-signer.pub

  foundation:
    name: Stage 1 Auth, RBAC and Audit / Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *setup_python
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify authentication boundaries and atomic audit delivery
        run: |
          age_dir="$RUNNER_TEMP/vpn-orbit-runtime-age"
          mkdir -p "$age_dir"
          python "$GITHUB_WORKSPACE/tools/fetch_age.py" --output "$age_dir/age.tar.gz"
          tar --no-same-owner -xzf "$age_dir/age.tar.gz" -C "$age_dir" -- age/age age/age-keygen
          export VPN_ORBIT_TEST_AGE_DIR="$age_dir/age"
          python -m unittest discover -s tests/app -t . -v
          python -m unittest discover -s tests/runtime -t . -v
      - name: Exercise synthetic capacity workload
        run: python -m tools.capacity_soak --warmup 0 --seconds 4

  isolated-runtime:
    name: Stage 1 process boundary / Linux UIDs and SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *setup_python
      - name: Install fixed application dependencies and SSH tools
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server iproute2 sudo
      - name: Verify isolated API, Worker, Broker and authority with a real managed SSH namespace
        run: |
          sudo -n /usr/bin/env "PATH=$PATH" "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "$(command -v python)" tests/lab/runtime_boundary.py --isolated-vm

  provisioning-faults:
    name: Provisioning fault injection / disposable SSH namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *setup_python
      - name: Install SSH, namespace and privilege tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server iproute2 sudo
          sudo systemctl enable --now ssh.service
      - name: Inject disconnects, partial accounts, helpers, keys and postcondition failures
        run: |
          sudo -n /usr/bin/env "PATH=$PATH" "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "$(command -v python)" tests/lab/provisioning_faults.py --isolated-vm

  firewall-faults:
    name: Firewall faults / disposable nftables and SSH namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - *checkout
      - *setup_python
      - name: Install namespace, SSH and firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server iproute2 sudo nftables
      - name: Test actual rules, new SSH, controller loss and SIGKILL rollback
        run: |
          sudo -n /usr/bin/env "PATH=$PATH" "PYTHONPATH=$PWD" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            "$(command -v python)" tests/lab/firewall_namespace.py --isolated-vm
